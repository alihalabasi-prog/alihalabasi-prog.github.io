<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Alabasi</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#0b0b0b;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
background:linear-gradient(135deg,#000,#111,#1d1d1d);
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:22px;
color:#ccc;
margin-bottom:40px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#d4af37;
color:#000;
text-decoration:none;
border-radius:50px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

.social{
padding:80px 20px;
text-align:center;
}

.social h2{
font-size:40px;
margin-bottom:40px;
}

.links{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.card{
background:#181818;
padding:25px;
border-radius:20px;
width:220px;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
background:#222;
}

.card a{
color:#fff;
text-decoration:none;
font-size:20px;
font-weight:bold;
}

footer{
padding:40px;
text-align:center;
color:#888;
}
</style>

</head>

<body>

<section class="hero">

<div>

<h1>Ali Alabasi</h1>

<p>Entrepreneur • Founder of VOS • Developer</p>

<a class="btn" href="#social">My Links</a>

</div>

</section>

<section class="social" id="social">

<h2>Follow Me</h2>

<div class="links">

<div class="card">
<a href="https://instagram.com/">Instagram</a>
</div>

<div class="card">
<a href="https://facebook.com/">Facebook</a>
</div>

<div class="card">
<a href="https://linkedin.com/">LinkedIn</a>
</div>

<div class="card">
<a href="https://github.com/alihalabasi-prog">GitHub</a>
</div>

</div>

</section>

<footer>

© 2026 Ali Alabasi

</footer>

</body>
</html>
